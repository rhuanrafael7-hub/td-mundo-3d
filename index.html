<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<title>TD Mundo 3D</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body { background: #f8f9fa; color: #333; font-family: sans-serif; font-size: 16px; line-height: 1.5; }
.app-container { min-height: 100vh; display: flex; flex-direction: column; background: #f8f9fa; }
header { padding: 32px 20px; text-align: center; border-bottom: 1px solid #e5e5e5; background: #fff; }
header h1 { font-size: 24px; color: #111; cursor: pointer; user-select: none; }
main { max-width: 1100px; width: 100%; margin: 0 auto; padding: 24px 20px; flex: 1; }
.section-title { font-size: 16px; font-weight: 600; color: #111; margin-bottom: 16px; padding-bottom: 6px; border-bottom: 2px solid #111; text-transform: uppercase; }
.products-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 16px; }
.product-card { background: #fff; border: 1px solid #e5e5e5; border-radius: 8px; overflow: hidden; padding: 14px; }
.wa-btn { display: block; text-align: center; margin-top: 10px; padding: 9px; background: #111; color: #fff; text-decoration: none; border-radius: 6px; font-size: 13px; }
aside { position: fixed; left: 0; top: 0; bottom: 0; width: 320px; background: #fff; border-right: 1px solid #ddd; padding: 24px; transform: translateX(-105%); transition: transform 0.3s; z-index: 50; box-shadow: 4px 0 20px rgba(0,0,0,0.1); overflow-y: auto; }
.admin-form-group { display: flex; flex-direction: column; gap: 6px; margin-bottom: 12px; }
.admin-form-group input { padding: 8px; border: 1px solid #ccc; border-radius: 4px; }
.admin-btn { padding: 10px; background: #111; color: #fff; border: none; border-radius: 4px; width: 100%; cursor: pointer; font-weight: 600; }
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>

<div class="app-container">
  <header>
    <!-- Duplo clique aqui abre o painel admin -->
    <h1 id="adminTrigger">TD Mundo 3D</h1>
    <p>Catálogo de Impressão 3D</p>
  </header>

  <main>
    <div id="catalogContainer">
      <p style="text-align:center; color:#666; margin-top:40px;">A carregar catálogo...</p>
    </div>
  </main>

  <aside id="adminPanel">
    <h3>Painel Admin</h3>
    <br>
    <div id="loginBox">
      <div class="admin-form-group">
        <label>Senha (1234)</label>
        <input type="password" id="senhaInput">
      </div>
      <button class="admin-btn" onclick="tentarLogin()">Entrar</button>
    </div>
    <div id="adminContent" style="display:none;">
      <p style="color:green; font-weight:600; margin-bottom:10px;">Autenticado com sucesso!</p>
      <div class="admin-form-group">
        <label>Nome do Produto</label>
        <input type="text" id="novoNome" placeholder="Ex: Vaso">
      </div>
      <div class="admin-form-group">
        <label>Preço (R$)</label>
        <input type="text" id="novoPreco" placeholder="39.90">
      </div>
      <button class="admin-btn" onclick="adicionarProduto()">Salvar Produto</button>
      <br><br>
      <button class="admin-btn" style="background:#cc0000;" onclick="toggleAdmin()">Fechar Painel</button>
    </div>
  </aside>
</div>

<script>
const SUPABASE_URL = "https://kdujdhckasageajfdzvl.supabase.co";
const SUPABASE_ANON_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImtkdWpkaGNrYXNhZ2VhamZkenZsIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTMzNjg0NTYsImV4cCI6MjEwODk0NDQ1Nn0.8ajKzglzlbmoFuD1aHZ22dAnT8zB4z-BKWUM1G-G1Ys";

const supabaseClient = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

async function carregar() {
  const container = document.getElementById('catalogContainer');
  try {
    const { data, error } = await supabaseClient.from('products').select('*');
    if (error) throw error;

    if (!data || data.length === 0) {
      container.innerHTML = '<p style="text-align:center; color:#666; margin-top:40px;">Ainda não há produtos. Faça duplo clique no título "TD Mundo 3D" para abrir o painel admin e adicionar o primeiro!</p>';
      return;
    }

    let html = '<div class="products-grid">';
    data.forEach(p => {
      html += `
        <div class="product-card">
          <h3>${p.name}</h3>
          <p>R$ ${Number(p.price).toFixed(2)}</p>
          <a class="wa-btn" href="https://wa.me/5511999999999?text=Olá,%20quero%20o%20produto%20${encodeURIComponent(p.name)}" target="_blank">Pedir no WhatsApp</a>
        </div>
      `;
    });
    html += '</div>';
    container.innerHTML = html;
  } catch (err) {
    container.innerHTML = '<p style="text-align:center; color:red; margin-top:40px;">Erro ao carregar dados. Verifique a consola (F12).</p>';
    console.error(err);
  }
}

document.getElementById('adminTrigger').addEventListener('dblclick', () => {
  const panel = document.getElementById('adminPanel');
  panel.style.transform = panel.style.transform === 'translateX(0px)' ? 'translateX(-105%)' : 'translateX(0px)';
});

function toggleAdmin() {
  document.getElementById('adminPanel').style.transform = 'translateX(-105%)';
}

function tentarLogin() {
  if (document.getElementById('senhaInput').value === '1234') {
    document.getElementById('loginBox').style.display = 'none';
    document.getElementById('adminContent').style.display = 'block';
  } else {
    alert('Senha incorreta!');
  }
}

async function adicionarProduto() {
  const name = document.getElementById('novoNome').value;
  const price = parseFloat(document.getElementById('novoPreco').value);
  if (!name || isNaN(price)) {
    alert('Preencha os campos corretamente.');
    return;
  }
  const { error } = await supabaseClient.from('products').insert([{ id: 'p_' + Date.now(), name, price }]);
  if (error) {
    alert('Erro ao guardar: ' + error.message);
    return;
  }
  alert('Produto adicionado!');
  document.getElementById('novoNome').value = '';
  document.getElementById('novoPreco').value = '';
  toggleAdmin();
  carregar();
}

carregar();
</script>

</body>
</html>
